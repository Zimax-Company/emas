services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: emas
      MYSQL_USER: emas
      MYSQL_PASSWORD: emas
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run migrate && npm run dev"
    environment:
      DATABASE_URL: mysql://emas:emas@mysql:3306/emas
      JWT_SECRET: dev-only-secret-change-me-please-32chars
      SEED_ADMIN_EMAIL: admin@emas.local
      SEED_ADMIN_PASSWORD: password
      WATCHPACK_POLLING: "true"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  node-modules:
    name: emas_api-node-modules # reuses the dependency cache from the earlier two-app setup
